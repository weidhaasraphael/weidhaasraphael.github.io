<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My GitHub Pages Site</title>
  <style>
    :root { --bg: #0f172a; --fg: #e2e8f0; --accent: #38bdf8; }
    html, body { margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--fg); }
    .wrap { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    p { margin: 0.5rem 0 0; line-height: 1.6; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="wrap">
    <div>
      <h1>Hello, world!</h1>
      <p>This site is hosted with GitHub Pages.</p>
      <p><a href="https://github.com/USERNAME">View my GitHub</a></p>
    </div>
  </main>
</body>
</html>
